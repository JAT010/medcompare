# MedCompare YAML demo — BASELINE snapshot (synthetic fixture).
# Fictional hospitals only. Not real patient or hospital data.
# Tri-state values are quoted strings: "YES" | "NO" | "UNKNOWN".
meta:
  label: medcompare-yaml-demo-baseline
  snapshot: baseline
  disclaimer: >-
    Synthetic DEMO fixture for validation. Real hospital API/feed integrations
    require an authorized source configuration and credentials and are not
    included by default. Search queries are not persistently stored.

