[project]
name = "universal-hospital-extractor"
version = "0.1.0"
description = "Universal hospital website intelligence extractor"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "beautifulsoup4>=...",
    "httpx>=...",
    "lxml>=...",
    "openpyxl>=...",
    "pandas>=...",
    "playwright>=...",
    "pydantic>=...",
    "pydantic-settings>=...",
]

[dependency-groups]
dev = [
    "mypy>=...",
    "pytest>=...",
    "pytest-cov>=...",
    "ruff>=...",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hospital_extractor"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.mypy]
python_version = "3.13"
strict = true