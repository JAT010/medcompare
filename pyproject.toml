[project]
name = "universal-hospital-extractor"
version = "0.1.0"
description = "Universal hospital website intelligence extractor"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "fastapi>=0.162.3",
    "httpx>=0.28.1",
    "lxml>=6.1.1",
    "openpyxl>=3.1.5",
    "pandas>=3.0.5",
    "playwright>=1.62.0",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.15.0",
    "uvicorn>=0.30",
]

[project.scripts]
hospital-extractor = "hospital_extractor.cli:main"

[dependency-groups]
dev = [
    "mypy>=1.18.0",
    "pandas-stubs>=3.0.4",
    "pytest>=8.4.0",
    "pytest-cov>=6.2.0",
    "ruff>=0.12.0",
    "types-openpyxl>=3.1.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hospital_extractor"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "integration: live network tests against a real hospital website",
]

[tool.mypy]
python_version = "3.13"
strict = true
plugins = ["pydantic.mypy"]
