[project]
name = "universal-hospital-extractor"
version = "0.1.0"
description = "MedCompare - hospital website intelligence extraction and side-by-side comparison"
readme = "README.md"
requires-python = ">=3.13,<3.14"
authors = [
    { name = "Devansh Dhama" },
]
urls = { Homepage = "https://github.com/JAT010/medcompare", Repository = "https://github.com/JAT010/medcompare" }
dependencies = [
    "beautifulsoup4>=4.15.0",
    "fastapi>=0.115.0",
    "httpx>=0.28.1",
    "jinja2>=3.1.4",
    "lxml>=6.1.1",
    "openpyxl>=3.1.5",
    "pandas>=3.0.5",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.15.0",
    "python-multipart>=0.0.18",
    "pyyaml>=6.0",
    "uvicorn>=0.32.0",
]

[project.scripts]
hospital-extractor = "hospital_extractor.cli:main"
medcompare-demo-server = "hospital_extractor.mockapi.console:main"

[project.optional-dependencies]
dev = [
    "mypy>=1.18.0",
    "pandas-stubs>=3.0.4",
    "pytest>=8.4.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=6.2.0",
    "ruff>=0.12.0",
    "types-openpyxl>=3.1.5",
    "types-PyYAML>=6.0",
]

[dependency-groups]
dev = [
    "mypy>=1.18.0",
    "pandas-stubs>=3.0.4",
    "pytest>=8.4.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=6.2.0",
    "ruff>=0.12.0",
    "types-openpyxl>=3.1.5",
    "types-PyYAML>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hospital_extractor"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "integration: live network tests against a real hospital website",
    "asyncio: tests that use asyncio",
]

[tool.mypy]
python_version = "3.13"
strict = true
plugins = ["pydantic.mypy"]