name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install package and dev tooling
        run: uv pip install --system -e ".[dev]"

      - name: Run tests
        run: pytest -q

      - name: Lint
        run: ruff check src tests

      - name: Type check
        run: mypy src

      # P25: package build (wheel/sdist) — validates packaging metadata
      - name: Build package
        run: python -m pip install build && python -m build

      # P25: clean-install smoke in an isolated venv (entry points importable)
      - name: Clean-install smoke test
        run: |
          python -m venv "$RUNNER_TEMP/smoke-venv"
          "$RUNNER_TEMP/smoke-venv/bin/pip" install dist/*.whl
          "$RUNNER_TEMP/smoke-venv/bin/hospital-extractor" --help
          "$RUNNER_TEMP/smoke-venv/bin/python" -c "from hospital_extractor.api.app import create_app; create_app()"

      # P25: CLI + API import/startup smoke (no network)
      - name: CLI verify-startup smoke
        run: hospital-extractor verify-startup

      # P25: clean-room DB init (fresh path)
      - name: Clean-room database init
        run: |
          rm -rf /tmp/clean-room-db && mkdir -p /tmp/clean-room-db
          hospital-extractor hospitals --db /tmp/clean-room-db/test.db || true
          test -f /tmp/clean-room-db/test.db

  # Optional Dockerfile syntax/sanity check (no push, no registry).
  docker-sanity:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Check Dockerfile exists and has non-root USER
        run: |
          test -f Dockerfile
          grep -q "^USER " Dockerfile
          grep -q "python:3.13" Dockerfile
